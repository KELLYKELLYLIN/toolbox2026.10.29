<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百宝箱 · Supabase 云同步版</title>
    <style>
        /* 保持你喜欢的样式不变 */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(145deg, #1e2b3a 0%, #121c26 100%); min-height: 100vh; display: flex; flex-direction: column; padding: 16px; }
        .app-container { width: 100%; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .top-nav { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 40px; border: 1px solid rgba(255,255,255,0.1); }
        .nav-btn { background: transparent; border: none; color: rgba(255,255,255,0.6); padding: 10px 22px; border-radius: 30px; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .nav-btn.active { background: #6c9eff; color: #0b1622; box-shadow: 0 4px 15px #6c9eff40; }
        .view-section { display: none; animation: fadeIn 0.3s ease; }
        .view-section.active { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; align-items: flex-start; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(18px); border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 25px 40px -10px rgba(0,0,0,0.6); padding: 24px 20px 28px; flex: 1 1 380px; max-width: 480px; width: 100%; }
        .full-width-card { flex: 1 1 100%; max-width: 800px; }
        .drop-zone { border: 2px dashed rgba(108, 158, 255, 0.4); border-radius: 24px; padding: 40px 20px; text-align: center; color: rgba(255, 255, 255, 0.6); cursor: pointer; transition: 0.2s; background: rgba(0, 0, 0, 0.2); margin-bottom: 20px; }
        .drop-zone:hover { border-color: #6c9eff; background: rgba(108, 158, 255, 0.1); color: #fff; }
        .drop-zone .icon { font-size: 2.5rem; margin-bottom: 12px; }
        .file-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; margin-bottom: 16px; }
        .file-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 12px 16px; border-radius: 16px; color: #eee; font-size: 0.9rem; }
        .file-item-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .file-item-info span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .file-actions button { background: rgba(255, 80, 80, 0.15); color: #ff7b7b; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
        .simple-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .scientific-buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .calc-btn { background: rgba(255,255,255,0.1); border: none; border-radius: 50px; padding: 16px 0; font-size: 1.1rem; font-weight: 500; color: #fff; cursor: pointer; transition: 0.1s; display: flex; align-items: center; justify-content: center; }
        .calc-btn:hover { background: rgba(255,255,255,0.25); }
        .calc-btn.operator { background: rgba(108, 158, 255, 0.3); color: #b6d0ff; }
        .calc-btn.operator:hover { background: rgba(108, 158, 255, 0.6); }
        .calc-btn.clear-btn { background: rgba(255, 80, 80, 0.2); color: #ff7b7b; }
        .calc-btn.bottom-equals { grid-column: span 4; background: rgba(255, 80, 80, 0.3); color: #fff; font-weight: 600; margin-top: 4px; padding: 18px 0; }
        .calc-btn.scientific-bottom-equals { grid-column: span 5; background: rgba(255, 80, 80, 0.3); color: #fff; font-weight: 600; margin-top: 4px; padding: 18px 0; }
        .calc-btn.small { font-size: 0.9rem; padding: 14px 0; }
        .calc-display { background: rgba(0,0,0,0.3); border-radius: 24px; padding: 20px 18px; margin-bottom: 20px; text-align: right; font-size: 2.2rem; font-weight: 400; color: #fff; word-break: break-all; border: 1px solid rgba(255,255,255,0.1); min-height: 90px; display: flex; align-items: center; justify-content: flex-end; }
        .mode-toggle { display: flex; background: rgba(0,0,0,0.3); border-radius: 40px; padding: 4px; margin-bottom: 20px; }
        .mode-btn { flex: 1; background: transparent; border: none; border-radius: 40px; padding: 10px 0; color: rgba(255,255,255,0.6); font-size: 0.95rem; cursor: pointer; transition: 0.2s; font-weight: 500; }
        .mode-btn.active { background: #6c9eff; color: #0b1622; box-shadow: 0 4px 12px #6c9eff40; }
        h1, h2 { font-size: 1.5rem; font-weight: 500; color: rgba(255,255,255,0.92); display: flex; align-items: center; gap: 10px; margin-bottom: 18px; padding-left: 6px; }
        h1::before { content: "✓"; color: #9bc9ff; }
        h2::before { content: "📅"; font-size: 1.3rem; }
        .input-area { display: flex; gap: 10px; margin-bottom: 20px; background: rgba(0,0,0,0.25); border-radius: 60px; padding: 6px 6px 6px 20px; border: 1px solid rgba(255,255,255,0.1); }
        .input-area input { flex: 1; background: transparent; border: none; outline: none; font-size: 1rem; padding: 10px 0; color: #fff; }
        .input-area button { background: #fff; border: none; border-radius: 50px; width: 46px; height: 46px; cursor: pointer; font-size: 1.6rem; color: #1d2a36; }
        .task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
        .task-item { display: flex; align-items: center; gap: 8px; background: rgba(20,30,40,0.7); border-radius: 50px; padding: 6px 8px 6px 16px; border: 1px solid rgba(255,255,255,0.08); }
        .task-check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); background: transparent; cursor: pointer; color:#fff; display:flex; align-items:center; justify-content:center; }
        .task-check.completed { background: #6c9eff; border-color: #6c9eff; color: #0b1622; }
        .task-text { flex: 1; font-size: 0.98rem; color: rgba(255,255,255,0.92); }
        .task-text.completed { text-decoration: line-through; color: rgba(255,255,255,0.4); }
        .task-delete { background: transparent; border: none; color: rgba(255,255,255,0.4); cursor: pointer; font-size: 1.1rem; }
        .footer-stats { display: flex; justify-content: space-between; margin-top: 18px; font-size: 0.8rem; color: rgba(255,255,255,0.4); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; color: #fff; }
        .calendar-header button { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.7rem; color: rgba(255,255,255,0.6); margin-bottom: 8px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 16px; }
        .day-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 0.85rem; color: #fff; cursor: pointer; position: relative; }
        .day-cell:hover { background: rgba(155, 201, 255, 0.2); }
        .day-cell.selected { background: #6c9eff; color: #0b1622; font-weight: 600; }
        .day-cell.has-reminder::after { content: "•"; position: absolute; bottom: 4px; font-size: 1.2rem; color: #9bc9ff; }
        .reminder-panel { margin-top: 8px; background: rgba(0,0,0,0.2); border-radius: 24px; padding: 14px; }
        .reminder-input-area { display: flex; gap: 8px; margin-bottom: 12px; }
        .reminder-input-area input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 40px; padding: 10px 14px; color: #fff; outline:none; }
        .reminder-input-area button { background: #6c9eff; border: none; border-radius: 40px; padding: 0 18px; color: #0b1622; font-weight: 600; cursor: pointer; }
        .reminder-list { list-style: none; max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .reminder-list li { display: flex; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 30px; font-size: 0.85rem; color: #eee; }
        .reminder-list li button { background: transparent; border: none; color: #ff7b7b; cursor: pointer; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-box { background: rgba(30, 45, 60, 0.95); border-radius: 36px; padding: 32px; max-width: 420px; width: 90%; text-align: center; color: #fff; }
        .modal-close-btn { background: #6c9eff; border: none; border-radius: 60px; padding: 12px 36px; font-weight: 600; color: #0b1622; cursor: pointer; margin-top: 20px; }
        .sync-status { position: fixed; top: 20px; right: 20px; padding: 8px 16px; border-radius: 30px; font-size: 0.8rem; background: rgba(0,0,0,0.5); color: #fff; transition: 0.3s; z-index: 900; }
        .sync-status.success { background: #6c9eff; color: #0b1622; }
        .sync-status.error { background: #ff7b7b; color: #fff; }
    </style>
</head>
<body>
<div class="sync-status" id="syncStatus">已连接云端</div>
<div class="app-container">
    <div class="top-nav">
        <button class="nav-btn active" data-target="view-home">🏠 主面板</button>
        <button class="nav-btn" data-target="view-calc">🧮 计算器</button>
        <button class="nav-btn" data-target="view-cloud">☁️ 收集箱</button>
    </div>
    <!-- 主面板 (任务+日历) -->
    <div class="view-section active" id="view-home">
        <div class="card">
            <h1>任务清单</h1>
            <div class="input-area">
                <input type="text" id="taskInput" placeholder="写一个任务...">
                <button id="addBtn">+</button>
            </div>
            <ul class="task-list" id="taskList"></ul>
            <div class="footer-stats">
                <span id="totalTasks">0 个任务</span>
                <span id="completedTasks">0 已完成</span>
            </div>
        </div>
        <div class="card">
            <h2>日历提醒</h2>
            <div class="calendar-header">
                <button id="prevMonth">‹</button>
                <span id="monthYear" style="font-weight:500; font-size:1.1rem;"></span>
                <button id="nextMonth">›</button>
            </div>
            <div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
            <div class="days-grid" id="daysGrid"></div>
            <div class="reminder-panel">
                <div style="font-size:0.9rem; color:rgba(255,255,255,0.7); margin-bottom:8px;">📌 提醒 · <span id="selectedDateLabel"></span></div>
                <div class="reminder-input-area">
                    <input type="text" id="reminderInput" placeholder="添加提醒事项...">
                    <button id="addReminderBtn">添加</button>
                </div>
                <ul class="reminder-list" id="reminderList"></ul>
            </div>
        </div>
    </div>
    <!-- 计算器 -->
    <div class="view-section" id="view-calc">
        <div class="card" style="max-width: 500px;">
            <h2 style="margin-bottom: 20px;">🧮 计算器</h2>
            <div class="mode-toggle">
                <button class="mode-btn active" id="modeSimple">简单</button>
                <button class="mode-btn" id="modeScientific">科学</button>
            </div>
            <div class="calc-display" id="calcDisplay">0</div>
            <div class="simple-buttons" id="simpleButtons">
                <button class="calc-btn clear-btn" data-value="C">C</button>
                <button class="calc-btn" data-value="7">7</button>
                <button class="calc-btn" data-value="8">8</button>
                <button class="calc-btn" data-value="9">9</button>
                <button class="calc-btn operator" data-value="/">÷</button>
                <button class="calc-btn" data-value="4">4</button>
                <button class="calc-btn" data-value="5">5</button>
                <button class="calc-btn" data-value="6">6</button>
                <button class="calc-btn operator" data-value="*">×</button>
                <button class="calc-btn" data-value="1">1</button>
                <button class="calc-btn" data-value="2">2</button>
                <button class="calc-btn" data-value="3">3</button>
                <button class="calc-btn operator" data-value="-">−</button>
                <button class="calc-btn" data-value="0">0</button>
                <button class="calc-btn" data-value=".">.</button>
                <button class="calc-btn operator" data-value="+">+</button>
                <button class="calc-btn bottom-equals" data-value="=">=</button>
            </div>
            <div class="scientific-buttons" id="scientificButtons" style="display: none;">
                <button class="calc-btn small" data-value="sin">sin</button>
                <button class="calc-btn small" data-value="cos">cos</button>
                <button class="calc-btn small" data-value="tan">tan</button>
                <button class="calc-btn small" data-value="log">log</button>
                <button class="calc-btn small" data-value="ln">ln</button>
                <button class="calc-btn small" data-value="√">√</button>
                <button class="calc-btn small" data-value="^">x^y</button>
                <button class="calc-btn small" data-value="π">π</button>
                <button class="calc-btn small" data-value="e">e</button>
                <button class="calc-btn small" data-value="!">n!</button>
                <button class="calc-btn small" data-value="(">(</button>
                <button class="calc-btn small" data-value=")">)</button>
                <button class="calc-btn small" data-value="⌫">⌫</button>
                <button class="calc-btn small clear-btn" data-value="C">C</button>
                <button class="calc-btn small operator" data-value="/">÷</button>
                <button class="calc-btn" data-value="7">7</button>
                <button class="calc-btn" data-value="8">8</button>
                <button class="calc-btn" data-value="9">9</button>
                <button class="calc-btn operator" data-value="*">×</button>
                <button class="calc-btn operator small" data-value="%">%</button>
                <button class="calc-btn" data-value="4">4</button>
                <button class="calc-btn" data-value="5">5</button>
                <button class="calc-btn" data-value="6">6</button>
                <button class="calc-btn operator" data-value="-">−</button>
                <button class="calc-btn operator small" data-value="1/x">1/x</button>
                <button class="calc-btn" data-value="1">1</button>
                <button class="calc-btn" data-value="2">2</button>
                <button class="calc-btn" data-value="3">3</button>
                <button class="calc-btn operator" data-value="+">+</button>
                <button class="calc-btn" data-value="+/-">±</button>
                <button class="calc-btn" data-value="0">0</button>
                <button class="calc-btn" data-value=".">.</button>
                <button class="calc-btn" data-value="C" style="grid-column: span 3; background: rgba(255,80,80,0.2);">C</button>
                <button class="calc-btn scientific-bottom-equals" data-value="=">=</button>
            </div>
        </div>
    </div>
    <!-- 收集箱 -->
    <div class="view-section" id="view-cloud">
        <div class="card full-width-card">
            <h2 style="margin-bottom: 20px;">☁️ 收集箱</h2>
            <p style="color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-bottom: 20px;">文字记录会同步到所有设备。文件和照片功能等待后续加入。</p>
            <div style="display: flex; gap: 10px; margin-bottom: 16px;">
                <input type="text" id="cloudTextInput" placeholder="记一段文字（云端同步）..." style="flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 40px; padding: 12px 18px; color: #fff; outline: none;">
                <button id="addCloudTextBtn" style="background: #6c9eff; border: none; border-radius: 40px; padding: 0 24px; color: #0b1622; font-weight: 600; cursor: pointer;">添加</button>
            </div>
            <ul class="file-list" id="cloudFileList"></ul>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button id="clearCloudBtn" style="flex:1; background: rgba(255,80,80,0.2); color: #ff7b7b; border:none; padding:14px; border-radius:30px; cursor:pointer;">🗑️ 清空文字记录</button>
            </div>
        </div>
    </div>
</div>
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <h3 style="font-size: 1.3rem; color: #9bc9ff; margin-bottom: 10px;">今日提醒</h3>
        <p id="modalMessage" style="font-size: 1rem; line-height: 1.5; margin-bottom: 24px;"></p>
        <button class="modal-close-btn" id="modalCloseBtn">知道了</button>
    </div>
</div>

<!-- 引入 Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ================= 1. 初始化 Supabase =================
    // ⚠️ 请替换为你刚才复制的两串密钥
    const SUPABASE_URL = 'https://ywvqlrtgxdyglxfkzzrv.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'sb_publishable_6BZtLifFQUTp8o4pKz6wIw_uGOm1HPs';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusEl = document.getElementById('syncStatus');
    function setSyncStatus(text, isError = false) {
        statusEl.textContent = text;
        statusEl.className = isError ? 'sync-status error' : 'sync-status success';
        if (!isError) {
            setTimeout(() => { statusEl.textContent = '云端在线'; statusEl.className = 'sync-status'; }, 2000);
        }
    }

    // ================= 2. 视图切换 =================
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.target).classList.add('active');
        });
    });
    document.getElementById('modalCloseBtn').addEventListener('click', () => {
        document.getElementById('modalOverlay').classList.remove('show');
    });

    // ================= 3. 任务清单 (Supabase) =================
    let tasks = [];
    const taskListEl = document.getElementById('taskList');
    const taskInput = document.getElementById('taskInput');

    async function fetchTasks() {
        try {
            const { data, error } = await supabase.from('tasks').select('*').order('id', { ascending: false });
            if (error) throw error;
            tasks = data || [];
            renderTasks();
        } catch(e) { console.error('拉取失败', e); }
    }

    function renderTasks() {
        taskListEl.innerHTML = '';
        tasks.forEach(t => {
            const li = document.createElement('li');
            li.className = 'task-item';
            li.innerHTML = `
                <button class="task-check ${t.completed ? 'completed' : ''}" onclick="toggleTask(${t.id}, ${t.completed})">${t.completed ? '✓' : '○'}</button>
                <span class="task-text ${t.completed ? 'completed' : ''}" ondblclick="editTask(${t.id}, '${t.text.replace(/'/g, "\\'")}')">${t.text}</span>
                <button class="task-delete" onclick="deleteTask(${t.id})">✕</button>
            `;
            taskListEl.appendChild(li);
        });
        document.getElementById('totalTasks').textContent = `${tasks.length} 个任务`;
        document.getElementById('completedTasks').textContent = `${tasks.filter(t => t.completed).length} 已完成`;
    }

    window.toggleTask = async (id, currentStatus) => {
        setSyncStatus('同步中...');
        await supabase.from('tasks').update({ completed: !currentStatus }).eq('id', id);
        fetchTasks(); setSyncStatus('已同步');
    };
    window.deleteTask = async (id) => {
        setSyncStatus('同步中...');
        await supabase.from('tasks').delete().eq('id', id);
        fetchTasks(); setSyncStatus('已同步');
    };
    window.editTask = async (id, oldText) => {
        const newText = prompt('修改任务内容：', oldText);
        if (newText !== null && newText.trim() !== '' && newText !== oldText) {
            setSyncStatus('同步中...');
            await supabase.from('tasks').update({ text: newText.trim() }).eq('id', id);
            fetchTasks(); setSyncStatus('已同步');
        }
    };
    document.getElementById('addBtn').addEventListener('click', async () => {
        const val = taskInput.value.trim();
        if (val) {
            setSyncStatus('同步中...');
            await supabase.from('tasks').insert([{ text: val, completed: false }]);
            taskInput.value = '';
            fetchTasks(); setSyncStatus('已同步');
        }
    });
    taskInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('addBtn').click(); });

    // ================= 4. 日历提醒 (Supabase) =================
    let reminders = {};
    let currentDate = new Date();
    let selectedDateStr = formatDate(currentDate);
    function formatDate(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
    }

    async function fetchReminders() {
        try {
            const { data, error } = await supabase.from('reminders').select('*').order('id', { ascending: false });
            if (error) throw error;
            reminders = {};
            (data || []).forEach(item => {
                if (!reminders[item.date]) reminders[item.date] = [];
                reminders[item.date].push({ id: item.id, text: item.text });
            });
            renderCalendar();
        } catch(e) { console.error('拉取失败', e); }
    }

    function renderCalendar() {
        const y = currentDate.getFullYear();
        const m = currentDate.getMonth();
        document.getElementById('monthYear').textContent = `${y}年 ${m + 1}月`;
        const firstDay = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const grid = document.getElementById('daysGrid');
        grid.innerHTML = '';
        for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const hasRmd = (reminders[dateStr] && reminders[dateStr].length > 0);
            grid.innerHTML += `<div class="day-cell ${dateStr === selectedDateStr ? 'selected' : ''} ${hasRmd ? 'has-reminder' : ''}" onclick="selectDate('${dateStr}')">${d}</div>`;
        }
        document.getElementById('selectedDateLabel').textContent = selectedDateStr;
        renderReminderPanel();
    }
    window.selectDate = (d) => { selectedDateStr = d; renderCalendar(); };
    function renderReminderPanel() {
        const list = reminders[selectedDateStr] || [];
        const ul = document.getElementById('reminderList');
        ul.innerHTML = list.length ? '' : '<div style="color:rgba(255,255,255,0.3);text-align:center;font-size:0.8rem;padding:10px;">暂无提醒</div>';
        list.forEach(item => {
            ul.innerHTML += `<li><span>${item.text}</span><button onclick="delReminder(${item.id})">✕</button></li>`;
        });
    }
    window.delReminder = async (id) => {
        setSyncStatus('同步中...');
        await supabase.from('reminders').delete().eq('id', id);
        fetchReminders(); setSyncStatus('已同步');
    };
    document.getElementById('prevMonth').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); });
    document.getElementById('nextMonth').addEventListener('click', () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); });
    document.getElementById('addReminderBtn').addEventListener('click', async () => {
        const input = document.getElementById('reminderInput');
        if (input.value.trim()) {
            setSyncStatus('同步中...');
            await supabase.from('reminders').insert([{ date: selectedDateStr, text: input.value.trim() }]);
            input.value = '';
            fetchReminders(); setSyncStatus('已同步');
        }
    });

    // ================= 5. 计算器 =================
    const calcDisplay = document.getElementById('calcDisplay');
    let calcExpr = '';
    document.querySelectorAll('.calc-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const val = btn.dataset.value;
            if (!val) return;
            if (val === 'C') { calcExpr = ''; calcDisplay.textContent = '0'; return; }
            if (val === '⌫') { calcExpr = calcExpr.slice(0, -1); calcDisplay.textContent = calcExpr || '0'; return; }
            if (val === '=') {
                try {
                    let e = calcExpr.replace(/sin\(/g, 'Math.sin(').replace(/cos\(/g, 'Math.cos(').replace(/tan\(/g, 'Math.tan(')
                                    .replace(/log\(/g, 'Math.log10(').replace(/ln\(/g, 'Math.log(').replace(/√\(/g, 'Math.sqrt(')
                                    .replace(/π/g, 'Math.PI').replace(/e/g, 'Math.E').replace(/\^/g, '**').replace(/%/g, '/100');
                    while(e.includes('!')) {
                        const m = e.match(/(\d+)!/);
                        if(!m) break;
                        let n = parseInt(m[1]), f = 1;
                        for(let i=2; i<=n; i++) f*=i;
                        e = e.replace(m[1]+'!', f);
                    }
                    calcExpr = Function('"use strict";return (' + e + ')')();
                    if(!isFinite(calcExpr)) calcExpr = '错误';
                    else calcExpr = parseFloat(calcExpr.toFixed(10)).toString();
                } catch { calcExpr = '错误'; }
                calcDisplay.textContent = calcExpr;
                return;
            }
            calcExpr += val;
            calcDisplay.textContent = calcExpr;
        });
    });
    document.getElementById('modeSimple').addEventListener('click', function() {
        this.classList.add('active'); document.getElementById('modeScientific').classList.remove('active');
        document.getElementById('simpleButtons').style.display = 'grid'; document.getElementById('scientificButtons').style.display = 'none';
    });
    document.getElementById('modeScientific').addEventListener('click', function() {
        this.classList.add('active'); document.getElementById('modeSimple').classList.remove('active');
        document.getElementById('scientificButtons').style.display = 'grid'; document.getElementById('simpleButtons').style.display = 'none';
    });

    // ================= 6. 收集箱 (本地暂存) =================
    let cloudFiles = JSON.parse(localStorage.getItem('toolbox_cloud_files')) || []; 
    const cloudListEl = document.getElementById('cloudFileList');
    function saveCloud() { localStorage.setItem('toolbox_cloud_files', JSON.stringify(cloudFiles)); renderCloud(); }
    function renderCloud() {
        cloudListEl.innerHTML = '';
        if (cloudFiles.length === 0) { cloudListEl.innerHTML = `<div style="text-align:center;color:rgba(255,255,255,0.3);padding:20px;">收集箱空空如也</div>`; return; }
        cloudFiles.forEach(f => {
            const li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = `<div class="file-item-info"><span>📝</span><span>${f.name}</span></div><div class="file-actions"><button onclick="deleteCloudItem('${f.id}')">删除</button></div>`;
            cloudListEl.appendChild(li);
        });
    }
    window.deleteCloudItem = (id) => { cloudFiles = cloudFiles.filter(f => f.id !== id); saveCloud(); };
    document.getElementById('addCloudTextBtn').addEventListener('click', () => {
        const input = document.getElementById('cloudTextInput');
        if (!input.value.trim()) return;
        cloudFiles.push({ id: Date.now().toString(), type: 'text', name: '文字笔记_' + new Date().toLocaleTimeString().replace(/:/g, '-'), textContent: input.value.trim() });
        input.value = ''; saveCloud();
    });
    document.getElementById('clearCloudBtn').addEventListener('click', () => {
        if(confirm('确定清空文字记录吗？')) { cloudFiles = []; saveCloud(); }
    });

    // ================= 启动 =================
    fetchTasks();
    fetchReminders();
    renderCloud();

    setTimeout(() => {
        const todayStr = formatDate(new Date());
        const todayRmd = reminders[todayStr] || [];
        const todayTasks = tasks.filter(t => !t.completed).length;
        if (todayRmd.length > 0 || todayTasks > 0) {
            let msg = '';
            if (todayRmd.length) msg += `📅 今天有 ${todayRmd.length} 条提醒；`;
            if (todayTasks) msg += `📋 还有 ${todayTasks} 个未完成任务。`;
            document.getElementById('modalMessage').textContent = msg;
            document.getElementById('modalOverlay').classList.add('show');
        }
    }, 1500);
</script>
</body>
